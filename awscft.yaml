AWSTemplateFormatVersion: "2010-09-09"
Description: "Creating the EC2 Instance Using the CFT"

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: ami-024ebedf48d280810
      KeyName: my-aws-keypair
      SecurityGroupIds:
        - sg-09f4aa7b5b0d844fc
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp2
        - DeviceName: /dev/sdf
          Ebs:
            VolumeSize: 50
            VolumeType: gp2
